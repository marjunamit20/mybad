<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>My bad</title>

  <!-- GOOGLE FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="blur blur1"></div>
  <div class="blur blur2"></div>

  <!-- INTRO SCREEN -->
  <div id="introScreen">

    <div class="intro-box">
<div class="intro-cat">
  <img src="catwave.gif">
</div>
      <h1 class="intro-title">
        Hi Ciarra Queen!

      </p>

      <button class="start-btn" id="startBtn">
        Click this!
      </button>

    </div>

  </div>

  <!-- MAIN SCREEN -->
  <div class="container" id="screen1">

    <div class="cat-box">
      <img src="sadcat.gif">
    </div>

    <h1 class="title">
      sorry nakatug ko 😔😔😔
    </h1>

      Please forgive mee 🥺
    </p>

    <div class="button-area" id="btnArea">

      <div id="yesCard">
        <button class="btn yes-btn" id="yesBtn">
          Yes 
        </button>
      </div>

      <div id="noCard">
        <button class="btn no-btn" id="noBtn">
          No 
        </button>
      </div>

    </div>

  </div>

  <!-- SUCCESS SCREEN -->
  <div class="container" id="screen2">

    <h1 class="success-title">
      YAYYYYY!! 💖
    </h1>

    <p class="success-text">
      You just made someone very happy 🥺
    </p>

    <div class="cat-box success-img">
      <img src="cat.gif">
    </div>

  </div>

  <!-- JAVASCRIPT -->
  <script src="script.js"></script>
